; ───────────────────────────────────────────────
;  인스타그램 게시 설정 (예시/공개용)
;  · 실제 값은 여기 넣지 않습니다. GitHub Secret(IG_USER_ID / IG_ACCESS_TOKEN)으로 주입됩니다.
;  · 로컬에서 직접 돌려볼 때만 instagram_config.ini(비공개)를 만들어 사용하세요.
;  · ig_user_id 는 인스타그램 '비즈니스 계정 ID'입니다(@아이디 아님).
;  · access_token 은 연결된 페이스북 '페이지 액세스 토큰'이며
;    instagram_basic / instagram_content_publish / pages_show_list 권한이 필요합니다.
;  · 발급 방법은 인스타_토큰받는법.md 참고.
; ───────────────────────────────────────────────
[instagram]
ig_user_id = 여기에는_넣지_않음_IG_USER_ID_환경변수사용
access_token = 여기에는_넣지_않음_IG_ACCESS_TOKEN_환경변수사용
