; ───────────────────────────────────────────────
;  페이스북 페이지 게시 설정 (예시/공개용)
;  · 실제 값은 여기 넣지 않습니다. GitHub Secret(FB_PAGE_ID / FB_PAGE_ACCESS_TOKEN)으로 주입됩니다.
;  · 로컬에서 직접 돌려볼 때만 facebook_config.ini(비공개)를 만들어 사용하세요.
;  · access_token 은 '페이지 액세스 토큰'입니다(사용자 토큰 아님). 만료되지 않습니다.
; ───────────────────────────────────────────────
[facebook]
page_id = 여기에는_넣지_않음_FB_PAGE_ID_환경변수사용
access_token = 여기에는_넣지_않음_FB_PAGE_ACCESS_TOKEN_환경변수사용
