name: 인스타그램 토큰 자동 갱신 (매달 1일)

# 인스타 로그인 방식 토큰은 60일이면 만료됩니다.
# 만료되면 자동 게시가 조용히 멈추므로, 매달 한 번 갱신해서
# IG_ACCESS_TOKEN Secret 을 새 값으로 덮어씁니다.
# (갱신하면 다시 60일이 되므로 한 달 주기면 충분히 여유롭습니다)

on:
  schedule:
    # 매달 1일 03:00 UTC = 12:00 KST
    - cron: '0 3 1 * *'
  workflow_dispatch:      # 필요할 때 수동 실행

concurrency:
  group: instagram-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install requests

      - name: 토큰 갱신
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          NEW=$(python instagram/get_token.py refresh --token "$IG_ACCESS_TOKEN" --raw)
          if [ -z "$NEW" ]; then
            echo "새 토큰을 받지 못했습니다."
            exit 1
          fi
          # 로그에 토큰이 찍히지 않도록 가림
          echo "::add-mask::$NEW"
          echo "NEW_TOKEN=$NEW" >> "$GITHUB_ENV"
          echo "갱신 성공. Secret 을 덮어씁니다."

      # Secret 쓰기는 기본 GITHUB_TOKEN 으로 안 되므로 별도 PAT 필요.
      - name: Secret 덮어쓰기
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SECRETS_ADMIN_PAT 이 없습니다. Secret 자동 갱신을 건너뜁니다."
            echo "토큰은 갱신됐지만 저장되지 않았으니 수동으로 넣어야 합니다."
            exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"
          echo "IG_ACCESS_TOKEN 갱신 완료. 다음 60일 확보."
