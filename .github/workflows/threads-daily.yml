name: 발행일 스레드 자동 게시 (오후 1시 43분 KST)

on:
  schedule:
    # 04:43 UTC = 13:43 KST. 발행일정에 오늘 글이 없으면 조용히 종료.
    # 정각(0분)은 전 세계 예약이 몰려 1~2시간씩 밀리므로 일부러 어중간한 분에 둠.
    - cron: '43 4 * * *'
  workflow_dispatch: {}   # GitHub 화면에서 수동 실행 버튼

# 진행 기록(threads/progress)을 저장소에 되돌려 커밋하기 위해 쓰기 권한 필요.
permissions:
  contents: write

# 같은 날 두 번 겹쳐 돌면 중복 게시 위험이 있으므로 동시 실행 금지.
concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install requests
      - name: 스레드 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads/post_to_threads.py

      # 성공하든 실패하든 진행 기록을 남겨야 다음 실행이 이어받을 수 있음.
      - name: 진행 기록 저장
        if: always()
        run: |
          if [ -z "$(git status --porcelain threads/progress)" ]; then
            echo "변경된 진행 기록 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/progress
          git commit -m "스레드 게시 진행 기록 [skip ci]"
          # 그 사이 다른 커밋이 올라왔을 수 있으므로 rebase 후 푸시
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
