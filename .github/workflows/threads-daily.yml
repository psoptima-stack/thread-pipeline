name: 발행일 스레드 자동 게시 (오후 6시 KST)

on:
  schedule:
    # 09:00 UTC = 18:00 KST (한국 오후 6시). 발행일정에 오늘 글이 없으면 조용히 종료.
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # GitHub 화면에서 수동 실행 버튼

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install requests
      - name: 스레드 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads/post_to_threads.py
