name: 매일 발행 이메일 (오후 1시 33분 KST)

on:
  schedule:
    # 04:33 UTC = 13:33 KST. GitHub 크론은 UTC 기준.
    # 정각(0분)은 전 세계 예약이 몰려 1~2시간씩 밀리므로 일부러 어중간한 분에 둠.
    - cron: '33 4 * * *'
  workflow_dispatch: {}   # GitHub 화면에서 수동 실행 버튼

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 이메일 발송
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python email/send_today_post.py
