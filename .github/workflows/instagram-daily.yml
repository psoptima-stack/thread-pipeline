name: 발행일 인스타그램 자동 게시 (오후 9시 KST)

on:
  schedule:
    # 12:00 UTC = 21:00 KST (한국 오후 9시). 발행일정에 오늘 글이 없으면 조용히 종료.
    - cron: '0 12 * * *'
  workflow_dispatch:      # GitHub 화면에서 수동 실행 버튼
    inputs:
      date:
        description: '게시할 날짜 (YYYY-MM-DD). 비우면 오늘 날짜'
        required: false
        default: ''
      restart:
        description: '이미 게시한 날짜라도 다시 게시(중복 주의)'
        type: boolean
        default: false

# 카드 이미지와 진행 기록을 저장소에 되돌려 커밋하기 위해 쓰기 권한 필요.
permissions:
  contents: write

# 같은 날 두 번 겹쳐 돌면 중복 게시 위험이 있으므로 동시 실행 금지.
concurrency:
  group: instagram-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install requests pillow

      - name: 날짜 정리
        env:
          IN_DATE: ${{ inputs.date }}
        run: |
          DATE="$IN_DATE"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "POST_DATE=$DATE" >> "$GITHUB_ENV"

      - name: 카드 이미지 생성
        run: python instagram/make_cards.py --date "$POST_DATE"

      # 인스타 API는 '공개된 이미지 주소'만 받으므로, 먼저 저장소에 올려서
      # raw.githubusercontent.com 주소가 살아 있게 만든 뒤에 게시해야 함.
      - name: 카드 이미지 커밋·푸시
        run: |
          if [ -n "$(git status --porcelain instagram/cards)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add instagram/cards
            git commit -m "인스타 카드 이미지 $POST_DATE [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "새로 만들어진 카드 없음(이미 올라가 있음)"
          fi
          # 브랜치 주소는 캐시가 남을 수 있어 커밋 해시로 고정해서 넘김
          echo "IMAGE_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 인스타그램 게시
        env:
          # 페이스북 페이지에 인스타를 연결할 수 없어(Meta 쪽 제한) 페이지를 거치지 않는
          # 'Instagram API with Instagram Login' 방식을 씁니다.
          # 나중에 페이지 연결이 되면 이 줄만 facebook 으로 바꾸면 됩니다.
          IG_API: instagram
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 셸에 직접 끼워 넣지 않고 환경변수로 받아서 처리
          IN_RESTART: ${{ inputs.restart }}
        run: |
          ARGS="--date $POST_DATE --ref $IMAGE_REF"
          if [ "$IN_RESTART" = "true" ]; then
            ARGS="$ARGS --restart"
          fi
          python instagram/post_to_instagram.py $ARGS

      # 성공하든 실패하든 진행 기록을 남겨야 중복 게시를 막을 수 있음.
      - name: 진행 기록 저장
        if: always()
        run: |
          if [ -z "$(git status --porcelain instagram/progress)" ]; then
            echo "변경된 진행 기록 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/progress
          git commit -m "인스타그램 게시 진행 기록 [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
